<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a51e36"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Girls Night"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Christmas Girls Night 🎀</title>
<style>
:root{--red:#a51e36;--red2:#7d172b;--pink:#f8dce4;--blush:#fff3f4;--green:#244b3c;--cream:#fffaf1;--gold:#c49a50;--ink:#34252a;--muted:#826e72;--line:#f0dfe1;--white:#fff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 5% 0%,#fbe5e9 0,transparent 28%),var(--cream);color:var(--ink);font-family:ui-rounded,"Avenir Next",system-ui,-apple-system,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1060px;margin:auto;padding:18px}.hero{position:relative;overflow:hidden;border-radius:28px;padding:30px 26px;background:linear-gradient(130deg,#8e1c34,#b52d48 60%,#d86b7d);color:white;box-shadow:0 14px 35px #8e1c3425}.hero:after{content:'✦  ✧  🎀  ✧  ✦';position:absolute;right:15px;bottom:14px;color:#ffffff80;font-size:24px;letter-spacing:8px}.eyebrow{letter-spacing:3px;text-transform:uppercase;font-size:11px;font-weight:800;color:#f8d9df}.hero h1{font-family:Georgia,serif;font-size:clamp(34px,7vw,58px);line-height:1;margin:10px 0}.hero p{margin:10px 0 0;color:#ffe9ed}.hero .sub{font-size:13px;letter-spacing:2px;text-transform:uppercase}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:15px 2px}.pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:12px;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0 14px;position:sticky;top:0;background:#fffaf1ed;z-index:3;backdrop-filter:blur(10px)}.tab{border:1px solid var(--line);background:white;color:var(--muted);border-radius:99px;padding:10px 14px;white-space:nowrap;font-size:13px;font-weight:700}.tab.active{background:var(--green);color:white;border-color:var(--green)}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 5px 18px #69263a08}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.stat{font-size:28px;font-weight:800;color:var(--red)}.muted{color:var(--muted);font-size:13px}.card h2{font: bold 20px Georgia,serif;margin:0 0 12px;color:var(--red2)}.card h3{margin:0 0 8px;font-size:15px}.btn{border:0;border-radius:12px;background:var(--red);color:white;padding:10px 14px;font-weight:750}.btn.secondary{background:var(--pink);color:var(--red2)}.btn.green{background:var(--green)}.btn.ghost{background:white;color:var(--red);border:1px solid var(--line)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;margin:9px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fffdfd;color:var(--ink);width:100%;outline-color:#d58a99}.field textarea{min-height:78px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f5e9eb}.item:last-child{border:0}.tag{background:#fcecf0;color:var(--red2);border-radius:99px;padding:4px 8px;font-size:11px;font-weight:700}.empty{padding:20px;text-align:center;color:var(--muted);background:var(--blush);border-radius:14px;font-size:13px}.progress{height:8px;border-radius:99px;background:#f5e8ea;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);width:0}.check{display:flex;gap:9px;align-items:center}.check input{accent-color:var(--green);width:17px;height:17px}.hide{display:none!important}.notice{padding:12px;border-radius:13px;background:#fff3d9;color:#76521c;font-size:13px;margin:12px 0}.success{background:#eaf4ee;color:#24513c}.footer{text-align:center;color:var(--muted);font-size:11px;padding:24px}.modalback{position:fixed;inset:0;background:#26141dcc;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:white;border-radius:22px;padding:22px;max-width:480px;width:100%;max-height:90vh;overflow:auto}.tiny{font-size:11px;color:var(--muted)}
@media(max-width:700px){.wrap{padding:12px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}.hero{padding:25px 20px;border-radius:22px}.span8,.span6,.span4{grid-column:span 12}.formgrid{grid-template-columns:1fr}.tabs{margin:0 -12px;padding:8px 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{min-height:44px;padding:11px 13px}.card{padding:15px}.hero:after{font-size:17px;letter-spacing:3px}.topline{align-items:flex-start;flex-direction:column}.topline .btn{width:100%;min-height:44px}.field input,.field select,.field textarea{font-size:16px;min-height:44px}.btn{min-height:44px}.item{align-items:flex-start}.item .row{flex-shrink:0}.modal{padding:18px}.modal .btn{width:100%}#app{padding-bottom:12px}}
</style>
</head>
<body><div class="wrap">
<header class="hero"><div class="eyebrow">Una noche para nosotras ✨</div><h1>Christmas<br>Girls Night</h1><p class="sub">Eat · Drink · Laugh · Celebrate</p><p>La magia está en reunirnos. ¡Vamos a organizarlo juntas! 🎄</p></header>
<div class="topline"><span class="pill" id="cloudStatus">● Modo local · configura la nube para compartir</span><button class="btn secondary" id="shareBtn">Compartir invitación ↗</button></div>
<nav class="tabs" id="tabs"><button class="tab active" data-tab="inicio">🎀 Inicio</button><button class="tab" data-tab="evento">📅 La cena</button><button class="tab" data-tab="invitadas">👯 Invitadas</button><button class="tab" data-tab="menu">🍽️ Menú</button><button class="tab" data-tab="tareas">🛍️ Tareas</button><button class="tab" data-tab="presupuesto">💰 Presupuesto</button><button class="tab" data-tab="notas">💌 Notas</button></nav>
<main id="app"></main><div class="footer">Hecho con cariño, bows y espíritu navideño 🎀 · Christmas Girls Night</div></div>
<div id="modalRoot"></div>
<script src="config.js"></script>
<script>
const CATS=['Plato principal','Acompañantes','Ensaladas','Picaderas','Postres','Bebidas','Hielo y desechables','Otros'];
const blank=()=>({event:{date:'',time:'',place:'',host:'',dress:'',gift:'',giftBudget:''},guests:[],menu:[],tasks:[],expenses:[],notes:[],budget:''});
let data=blank(),tab='inicio',guestName=localStorage.getItem('cgn_name')||'',roomToken=new URLSearchParams(location.search).get('room'),cloud=null,saveTimer=null;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'RD$ '+Number(n||0).toLocaleString('es-DO',{minimumFractionDigits:2,maximumFractionDigits:2});
function persist(){localStorage.setItem('cgn_data_'+(roomToken||'demo'),JSON.stringify(data));if(cloud){clearTimeout(saveTimer);saveTimer=setTimeout(saveCloud,500)}}
function loadLocal(){try{data=JSON.parse(localStorage.getItem('cgn_data_'+(roomToken||'demo')))||blank()}catch{data=blank()}}
function setTab(t){tab=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}
$('#tabs').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b)setTab(b.dataset.tab)});
function addModal(title,html,fn){$('#modalRoot').innerHTML=`<div class="modalback" id="back"><div class="modal"><div class="row" style="justify-content:space-between"><h2>${title}</h2><button class="btn ghost" id="close">✕</button></div>${html}</div></div>`;$('#close').onclick=()=>$('#modalRoot').innerHTML='';$('#back').onclick=e=>{if(e.target.id==='back')$('#modalRoot').innerHTML=''};fn?.()}
function field(id,label,type='text',value='',placeholder=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" placeholder="${placeholder}"></div>`}
function render(){let a='';if(tab==='inicio')a=home();if(tab==='evento')a=eventPage();if(tab==='invitadas')a=guestsPage();if(tab==='menu')a=menuPage();if(tab==='tareas')a=tasksPage();if(tab==='presupuesto')a=budgetPage();if(tab==='notas')a=notesPage();$('#app').innerHTML=a;bind()}
function home(){let done=data.tasks.filter(x=>x.done).length,claimed=data.menu.filter(x=>x.person).length;return `<div class="grid"><section class="card span8"><h2>¡Nuestra noche! 🎄</h2><p>${data.event.date?new Date(data.event.date+'T12:00:00').toLocaleDateString('es-DO',{weekday:'long',day:'numeric',month:'long',year:'numeric'}):'Fecha por definir'} · ${esc(data.event.time||'Hora por definir')}</p><p class="muted">${esc(data.event.place||'Lugar por definir')} ${data.event.host?'· Organiza '+esc(data.event.host):''}</p><div class="row" style="margin-top:15px"><button class="btn" data-go="evento">Editar detalles</button><button class="btn secondary" data-go="invitadas">Invitar amigas</button></div></section><section class="card span4"><h2>Un vistazo ✨</h2><div class="row" style="justify-content:space-between"><div><div class="stat">${data.guests.length}</div><div class="muted">Invitadas</div></div><div><div class="stat">${claimed}/${data.menu.length}</div><div class="muted">Platos asignados</div></div><div><div class="stat">${done}/${data.tasks.length}</div><div class="muted">Tareas listas</div></div></div></section><section class="card span6"><h2>🍽️ El menú</h2>${data.menu.length?data.menu.slice(0,5).map(x=>`<div class="item"><span>${esc(x.name)}</span><span class="tag">${esc(x.person||'Por asignar')}</span></div>`).join(''):'<div class="empty">Todavía no hay platos. ¡Vamos a llenar esa mesa!</div>'}<button class="btn secondary" data-go="menu">Organizar menú</button></section><section class="card span6"><h2>🛍️ Pendientes</h2>${data.tasks.length?`<div class="progress"><i style="width:${done/data.tasks.length*100}%"></i></div><p class="muted">${done} de ${data.tasks.length} completadas</p>`:'<div class="empty">Aún no hay tareas agregadas.</div>'}<button class="btn secondary" data-go="tareas">Ver tareas</button></section><section class="card span12"><h2>Dress code & detalles</h2><p>${esc(data.event.dress||'El dress code está por definirse 💃')}</p>${data.event.gift?`<p class="muted">Intercambio de regalos: ${esc(data.event.gift)} ${data.event.giftBudget?'· Presupuesto '+money(data.event.giftBudget):''}</p>`:''}</section></div>`}
function eventPage(){return `<section class="card"><h2>📅 Detalles de la cena</h2><div class="formgrid">${field('date','Fecha','date',data.event.date)}${field('time','Hora','time',data.event.time)}${field('place','Lugar', 'text',data.event.place,'Dirección o nombre del lugar')}${field('host','Anfitriona','text',data.event.host)}${field('dress','Dress code','text',data.event.dress,'Ej. Rojo, blanco y dorado')}${field('gift','Intercambio de regalos','text',data.event.gift,'Opcional')}${field('giftBudget','Presupuesto del regalo (RD$)','number',data.event.giftBudget)}</div><button class="btn" id="saveEvent">Guardar detalles</button></section>`}
function guestsPage(){return `<section class="card"><div class="row" style="justify-content:space-between"><h2>👯 Lista de invitadas</h2><button class="btn" id="addGuest">+ Agregar</button></div>${data.guests.length?data.guests.map((g,i)=>`<div class="item"><div><b>${esc(g.name)}</b><div class="muted">${esc(g.note||'')}</div></div><div class="row"><select data-rsvp="${i}" aria-label="Confirmación de ${esc(g.name)}"><option ${g.status==='Pendiente'?'selected':''}>Pendiente</option><option ${g.status==='Confirmada'?'selected':''}>Confirmada</option><option ${g.status==='No asistirá'?'selected':''}>No asistirá</option></select><button class="btn ghost" data-delguest="${i}">✕</button></div></div>`).join(''):'<div class="empty">Agrega a tus girls para empezar la lista 💗</div>'}</section>`}
function menuPage(){return `<section class="card"><div class="row" style="justify-content:space-between"><h2>🍽️ Menú colaborativo</h2><button class="btn" id="addDish">+ Agregar plato</button></div><p class="muted">Cada amiga puede apuntarse a llevar algo. ¡Así evitamos que falte o se repita todo!</p>${data.menu.length?data.menu.map((m,i)=>`<div class="item"><div><b>${esc(m.name)}</b><div class="muted">${esc(m.category)} · ${esc(m.qty||'Cantidad por definir')}</div><div class="muted">Lleva: ${esc(m.person||'Aún sin asignar')}</div></div><div class="row"><button class="btn secondary" data-claim="${i}">${m.person?'Cambiar responsable':'Me encargo'}</button><button class="btn ghost" data-deldish="${i}">✕</button></div></div>`).join(''):'<div class="empty">El menú está en blanco. Agreguen sus platos favoritos 🎄</div>'}</section><section class="card" style="margin-top:14px"><h2>¿Qué categorías faltan?</h2>${CATS.map(c=>`<span class="tag" style="display:inline-block;margin:4px">${esc(c)} · ${data.menu.some(m=>m.category===c)?'✓':'Pendiente'}</span>`).join('')}</section>`}
function tasksPage(){let n=data.tasks.filter(t=>t.done).length;return `<section class="card"><div class="row" style="justify-content:space-between"><h2>🛍️ Lista de tareas</h2><button class="btn" id="addTask">+ Nueva tarea</button></div><p class="muted">${n} de ${data.tasks.length} tareas completadas</p><div class="progress"><i style="width:${data.tasks.length?n/data.tasks.length*100:0}%"></i></div>${data.tasks.length?data.tasks.map((t,i)=>`<div class="item"><label class="check"><input type="checkbox" data-task="${i}" ${t.done?'checked':''}><span style="${t.done?'text-decoration:line-through;color:#9b8c8f':''}">${esc(t.name)}<div class="muted">${esc(t.person||'Sin responsable')}</div></span></label><button class="btn ghost" data-deltask="${i}">✕</button></div>`).join(''):'<div class="empty" style="margin-top:12px">No hay tareas todavía. ¡Planifiquen juntas!</div>'}</section>`}
function budgetPage(){let total=data.expenses.reduce((s,x)=>s+Number(x.amount||0),0),count=data.guests.filter(g=>g.status!=='No asistirá').length;return `<div class="grid"><section class="card span6"><h2>💰 Presupuesto</h2>${field('budget','Aporte estimado por persona (RD$)','number',data.budget)}<button class="btn" id="saveBudget">Guardar</button><p class="muted">${count?`Aporte estimado total: ${money(Number(data.budget||0)*count)} (${count} invitadas consideradas)`:'Agrega invitadas para calcular el estimado.'}</p></section><section class="card span6"><h2>Gastos registrados</h2><div class="stat">${money(total)}</div><div class="muted">Total anotado hasta ahora</div><button class="btn secondary" id="addExpense" style="margin-top:12px">+ Registrar gasto</button></section><section class="card span12"><h2>Detalle de gastos</h2>${data.expenses.length?data.expenses.map((x,i)=>`<div class="item"><span>${esc(x.name)}<div class="muted">Pagó: ${esc(x.person||'Sin indicar')}</div></span><b>${money(x.amount)}</b><button class="btn ghost" data-delexp="${i}">✕</button></div>`).join(''):'<div class="empty">Aún no hay gastos registrados.</div>'}</section></div>`}
function notesPage(){return `<section class="card"><div class="row" style="justify-content:space-between"><h2>💌 Notas y anuncios</h2><button class="btn" id="addNote">+ Escribir nota</button></div>${data.notes.length?data.notes.map((x,i)=>`<div class="item"><div><b>${esc(x.title)}</b><p style="margin:5px 0">${esc(x.body)}</p><div class="tiny">${esc(x.by||'Una de las girls')}</div></div><button class="btn ghost" data-delnote="${i}">✕</button></div>`).join(''):'<div class="empty">Ideas, playlist, recordatorios y todo lo que no se nos puede olvidar ✨</div>'}</section>`}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setTab(b.dataset.go));$('#saveEvent')?.addEventListener('click',()=>{['date','time','place','host','dress','gift','giftBudget'].forEach(k=>data.event[k]=$('#'+k).value);persist();render();toast('Detalles guardados 💗')});$('#addGuest')?.addEventListener('click',()=>addModal('Nueva invitada',field('gname','Nombre')+field('gnote','Nota opcional'),()=>{$('#modalRoot .modal').insertAdjacentHTML('beforeend','<button class="btn" id="ok">Agregar invitada</button>');$('#ok').onclick=()=>{let name=$('#gname').value.trim();if(!name)return alert('Escribe un nombre');data.guests.push({name,note:$('#gnote').value,status:'Pendiente'});persist();$('#modalRoot').innerHTML='';render()}}));document.querySelectorAll('[data-rsvp]').forEach(x=>x.onchange=()=>{data.guests[+x.dataset.rsvp].status=x.value;persist()});document.querySelectorAll('[data-delguest]').forEach(x=>x.onclick=()=>{data.guests.splice(+x.dataset.delguest,1);persist();render()});$('#addDish')?.addEventListener('click',()=>addModal('Agregar al menú',field('dname','Plato o artículo')+`<div class="field"><label>Categoría</label><select id="dcat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>`+field('dqty','Cantidad / porciones')+field('dperson','¿Quién lo lleva?'),()=>{$('#modalRoot .modal').insertAdjacentHTML('beforeend','<button class="btn" id="ok">Guardar plato</button>');$('#ok').onclick=()=>{let name=$('#dname').value.trim();if(!name)return alert('Escribe el plato');data.menu.push({name,category:$('#dcat').value,qty:$('#dqty').value,person:$('#dperson').value});persist();$('#modalRoot').innerHTML='';render()}}));document.querySelectorAll('[data-claim]').forEach(x=>x.onclick=()=>{let m=data.menu[+x.dataset.claim];addModal('¿Quién lo lleva?',field('claimname','Nombre', 'text',guestName),()=>{$('#modalRoot .modal').insertAdjacentHTML('beforeend','<button class="btn" id="ok">Confirmar</button>');$('#ok').onclick=()=>{let v=$('#claimname').value.trim();if(!v)return alert('Escribe tu nombre');m.person=v;guestName=v;localStorage.setItem('cgn_name',v);persist();$('#modalRoot').innerHTML='';render()}})});document.querySelectorAll('[data-deldish]').forEach(x=>x.onclick=()=>{data.menu.splice(+x.dataset.deldish,1);persist();render()});$('#addTask')?.addEventListener('click',()=>addModal('Nueva tarea',field('tname','Tarea')+field('tperson','Responsable'),()=>{$('#modalRoot .modal').insertAdjacentHTML('beforeend','<button class="btn" id="ok">Agregar</button>');$('#ok').onclick=()=>{let name=$('#tname').value.trim();if(!name)return alert('Escribe una tarea');data.tasks.push({name,person:$('#tperson').value,done:false});persist();$('#modalRoot').innerHTML='';render()}}));document.querySelectorAll('[data-task]').forEach(x=>x.onchange=()=>{data.tasks[+x.dataset.task].done=x.checked;persist();render()});document.querySelectorAll('[data-deltask]').forEach(x=>x.onclick=()=>{data.tasks.splice(+x.dataset.deltask,1);persist();render()});$('#saveBudget')?.addEventListener('click',()=>{data.budget=$('#budget').value;persist();render()});$('#addExpense')?.addEventListener('click',()=>addModal('Registrar gasto',field('ename','Descripción')+field('eamount','Monto RD$','number')+field('eperson','Quién pagó'),()=>{$('#modalRoot .modal').insertAdjacentHTML('beforeend','<button class="btn" id="ok">Guardar gasto</button>');$('#ok').onclick=()=>{if(!$('#ename').value.trim()||!$('#eamount').value)return alert('Completa descripción y monto');data.expenses.push({name:$('#ename').value,amount:Number($('#eamount').value),person:$('#eperson').value});persist();$('#modalRoot').innerHTML='';render()}}));document.querySelectorAll('[data-delexp]').forEach(x=>x.onclick=()=>{data.expenses.splice(+x.dataset.delexp,1);persist();render()});$('#addNote')?.addEventListener('click',()=>addModal('Nueva nota',field('ntitle','Título')+`<div class="field"><label>Mensaje</label><textarea id="nbody"></textarea></div>`+field('nby','De parte de'),()=>{$('#modalRoot .modal').insertAdjacentHTML('beforeend','<button class="btn" id="ok">Publicar nota</button>');$('#ok').onclick=()=>{if(!$('#ntitle').value.trim())return alert('Escribe un título');data.notes.push({title:$('#ntitle').value,body:$('#nbody').value,by:$('#nby').value});persist();$('#modalRoot').innerHTML='';render()}}));document.querySelectorAll('[data-delnote]').forEach(x=>x.onclick=()=>{data.notes.splice(+x.dataset.delnote,1);persist();render()})}
function toast(s){let el=document.createElement('div');el.className='notice success';el.textContent=s;$('#app').prepend(el);setTimeout(()=>el.remove(),2200)}
$('#shareBtn').onclick=()=>{let url=location.href;if(navigator.share)navigator.share({title:'Christmas Girls Night 🎀',text:'¡Vamos a organizar nuestra cena navideña juntas!',url});else navigator.clipboard?.writeText(url).then(()=>alert('Enlace copiado. Compártelo con tus amigas.'))};
// Cloud mode uses Supabase RPC configured in config.js. Without it, data remains on this device only.
async function initCloud(){if(!window.CGN_CONFIG?.url||!window.CGN_CONFIG?.anonKey){loadLocal();render();return}try{let {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');cloud=createClient(window.CGN_CONFIG.url,window.CGN_CONFIG.anonKey);if(!roomToken){roomToken=crypto.randomUUID();let u=new URL(location.href);u.searchParams.set('room',roomToken);history.replaceState({},'',u);await cloud.rpc('cgn_create_room',{p_token:roomToken,p_data:data})}else{let {data:remote,error}=await cloud.rpc('cgn_get_room',{p_token:roomToken});if(error)throw error;if(remote)data=remote;else{await cloud.rpc('cgn_create_room',{p_token:roomToken,p_data:data})}}$('#cloudStatus').textContent='● Espacio compartido activo';$('#cloudStatus').classList.add('success');render();// Polling works with the locked-down RPC-only table permissions and keeps every phone in sync.
setInterval(async()=>{if(!cloud||!roomToken||document.hidden)return;try{let {data:remote,error}=await cloud.rpc('cgn_get_room',{p_token:roomToken});if(error)throw error;if(remote){const before=JSON.stringify(data),after=JSON.stringify(remote);if(before!==after){data=remote;localStorage.setItem('cgn_data_'+roomToken,after);render()}}}catch(e){console.warn('Sync check failed',e)}},4000)}catch(e){console.error(e);loadLocal();$('#cloudStatus').textContent='● No se pudo conectar a la nube';render()}}
async function saveCloud(){if(!cloud||!roomToken)return;let {error}=await cloud.rpc('cgn_save_room',{p_token:roomToken,p_data:data});if(error){console.error(error);$('#cloudStatus').textContent='● Error guardando cambios';}}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
initCloud();
</script>
</body></html>
